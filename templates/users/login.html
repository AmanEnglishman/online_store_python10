<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход | TechStore</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: #f5f7fa;
        }

        header {
            background: #000;
            color: #fff;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
        }

        header a {
            color: #fff;
            text-decoration: none;
            margin-left: 20px;
            opacity: 0.8;
        }

        header a:hover {
            opacity: 1;
        }

        .auth-container {
            height: calc(100vh - 70px);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .auth-card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            width: 350px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .auth-card h2 {
            margin-bottom: 20px;
            text-align: center;
        }

        .auth-card form {
            display: flex;
            flex-direction: column;
        }

        .auth-card input {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 14px;
        }

        .auth-card button {
            padding: 12px;
            background: black;
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
        }

        .auth-card p {
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
        }

        .auth-card a {
            color: #0071e3;
            text-decoration: none;
        }
    </style>
</head>
<body>

<header>
    <h1>TechStore</h1>
    <nav>
        <a href="/">Главная</a>
        <a href="{% url 'register' %}">Регистрация</a>
    </nav>
</header>

<div class="auth-container">
    <div class="auth-card">
        <h2>Вход</h2>

        <form method="post">
            {% csrf_token %}
            {{ form.username }}
            {{ form.password }}

            <button type="submit">Войти</button>
        </form>

        <p>Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></p>
    </div>
</div>

</body>
</html>
