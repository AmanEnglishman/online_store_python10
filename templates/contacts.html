<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Контакты | TechStore</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background: #f5f7fa;
            color: #111;
        }

        /* HEADER */
        header {
            background: #000;
            color: #fff;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 24px;
        }

        nav a {
            color: #fff;
            margin-left: 20px;
            text-decoration: none;
            font-size: 14px;
            opacity: 0.8;
        }

        nav a:hover {
            opacity: 1;
        }

        /* MAIN */
        .container {
            padding: 40px;
            max-width: 1200px;
            margin: auto;
        }

        .title {
            font-size: 32px;
            margin-bottom: 30px;
        }

        .contact-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        /* INFO */
        .info {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .info h3 {
            margin-bottom: 20px;
        }

        .info p {
            margin-bottom: 10px;
            color: #555;
        }

        /* FORM */
        .form {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .form h3 {
            margin-bottom: 20px;
        }

        .form input,
        .form textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #ddd;
            font-size: 14px;
        }

        .form textarea {
            resize: none;
            height: 120px;
        }

        .form button {
            background: #0071e3;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        .form button:hover {
            background: #005bb5;
        }

        /* MAP */
        .map {
            margin-top: 40px;
            border-radius: 15px;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 300px;
            border: none;
        }

        /* FOOTER */
        footer {
            margin-top: 40px;
            padding: 20px;
            text-align: center;
            background: #111;
            color: #aaa;
        }

        /* MOBILE */
        @media (max-width: 768px) {
            .contact-wrapper {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<header>
    <h1>TechStore</h1>
    <nav>
        <a href="/">Главная</a>
        <a href="#">Каталог</a>
        <a href="{% url 'contacts' %}">Контакты</a>
    </nav>
</header>

<div class="container">
    <h2 class="title">Свяжитесь с нами</h2>

    <div class="contact-wrapper">

        <!-- INFO -->
        <div class="info">
            <h3>Контактная информация</h3>
            <p>📍 Бишкек, Кыргызстан</p>
            <p>📞 +996 704 227 177</p>
            <p>✉️ support@techstore.kg</p>
            <p>🕒 Пн–Вс: 9:00 – 21:00</p>
        </div>

        <!-- FORM -->
        <div class="form">
            <h3>Напишите нам</h3>
            <form method="post">
                {% csrf_token %}
                <input type="text" name="name" placeholder="Ваше имя" required>
                <input type="email" name="email" placeholder="Email" required>
                <textarea name="message" placeholder="Ваше сообщение" required></textarea>
                <button type="submit">Отправить</button>
            </form>
        </div>

    </div>

    <!-- MAP -->
    <div class="map">
        <iframe
            src="https://maps.google.com/maps?q=Bishkek&t=&z=13&ie=UTF8&iwloc=&output=embed">
        </iframe>
    </div>
</div>

<footer>
    © 2026 TechStore — Контакты
</footer>

</body>
</html>
